<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · AMD Live</title>
<style>
:root{--bg:#0a0e14;--card:#121821;--card2:#171f2b;--line:#232d3b;--txt:#e6edf5;--mut:#8593a6;--ok:#2fd27a;--warn:#f5b342;--bad:#ff5d5d;--acc:#3aa0ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#13243a 0,transparent 60%),var(--bg);color:var(--txt);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2fd27a,#1a8f55);display:grid;place-items:center;font-weight:900;color:#06130b}
h1{font-size:20px;margin:0}.sub{color:var(--mut);font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:#36465c;background:#1c2634}
.btn.pri{background:linear-gradient(135deg,#2fd27a,#20a862);color:#04130a;border:0}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
input,select{background:#0e141c;border:1px solid var(--line);color:var(--txt);padding:10px 12px;border-radius:10px;font:inherit;outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px #3aa0ff22}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat .n{font-size:26px;font-weight:800;margin-top:2px}.stat .l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.stat.ok .n{color:var(--ok)}.stat.on .n{color:var(--acc)}.stat.bad .n{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:14px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>input{flex:1;min-width:160px}
.novo{margin-top:12px;display:none;align-items:center;gap:10px;background:#0f2a1c;border:1px solid #1f6b42;border-radius:12px;padding:10px 12px}
.novo code{font-size:15px;font-weight:800;color:var(--ok);flex:1;word-break:break-all}
.res{margin-top:10px;font-weight:600;min-height:20px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px}.tab{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);cursor:pointer;font:inherit;font-weight:600;font-size:13px}
.tab.on{background:#1b2735;color:var(--txt);border-color:#36465c}
.users{display:grid;gap:10px}
.u{display:grid;grid-template-columns:44px 1.4fr 1.3fr 1fr 1fr auto;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;transition:.15s}
.u:hover{border-color:#32404f}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:#fff;position:relative}
.av .dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);background:#556273}
.av .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.nm{font-weight:700;font-size:15px}.cd{color:var(--mut);font-size:12px;font-family:ui-monospace,Consolas,monospace;cursor:pointer}
.cd:hover{color:var(--txt)}
.lbl{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.val{font-weight:700}
.bar{height:6px;border-radius:9px;background:#0d131b;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700}
.pill.ok{background:#11331f;color:var(--ok)}.pill.warn{background:#3a2a0e;color:var(--warn)}.pill.bad{background:#3a1414;color:var(--bad)}
.acts{display:flex;gap:6px}
.vazio{text-align:center;color:var(--mut);padding:40px}
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login .logo{margin:0 auto 14px;width:56px;height:56px;font-size:20px}
.login input{width:100%;margin:14px 0 10px}
.login .btn{width:100%}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.note{color:var(--mut);font-size:12px;margin-top:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1c2634;border:1px solid #36465c;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.u{grid-template-columns:44px 1fr auto}.u .hide-m{display:none}}
</style></head><body>
<div id="login" class="login card">
  <div class="logo">AMD</div>
  <h1>Painel do administrador</h1>
  <div class="sub">AMD Live · acesso restrito</div>
  <input id="k" type="password" placeholder="Senha do admin" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()">
  <button class="btn pri" onclick="entrar()">Entrar</button>
  <div class="err" id="dica"></div>
</div>

<div id="painel" class="wrap" style="display:none">
  <header>
    <div class="brand"><div class="logo">AMD</div><div><h1>Painel do administrador</h1><div class="sub" id="atual">—</div></div></div>
    <div class="row"><button class="btn ghost" onclick="teste()">🔔 Testar alerta</button><button class="btn ghost" onclick="sair()">Sair</button></div>
  </header>

  <div class="stats">
    <div class="card stat ok"><div class="l">Ativos</div><div class="n" id="sAtivos">0</div></div>
    <div class="card stat on"><div class="l">Online agora</div><div class="n" id="sOnline">0</div></div>
    <div class="card stat bad"><div class="l">Expirados</div><div class="n" id="sExp">0</div></div>
    <div class="card stat"><div class="l">Uso total</div><div class="n" id="sUso">0h</div></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>Novo acesso</h3>
      <div class="row">
        <input id="nome" placeholder="Nome do cliente">
        <select id="dias"><option value="0.125">3 horas</option><option value="1">1 dia</option><option value="7">7 dias</option><option value="15">15 dias</option><option value="30" selected>30 dias</option><option value="90">90 dias</option></select>
        <button class="btn pri" onclick="criar()">Criar código</button>
      </div>
      <div class="novo" id="novo"><code id="novoCod"></code><button class="btn sm" onclick="copiar(document.getElementById('novoCod').textContent)">Copiar</button></div>
    </div>
    <div class="card">
      <h3>Consultar código</h3>
      <div class="row"><input id="cons" placeholder="AMD-..." onkeydown="if(event.key==='Enter')consultar()"><button class="btn" onclick="consultar()">Ver</button></div>
      <div class="res" id="consRes"></div>
    </div>
  </div>

  <div class="toolbar">
    <div class="tabs" id="tabs">
      <button class="tab on" data-f="todos">Todos</button><button class="tab" data-f="ativos">Ativos</button><button class="tab" data-f="online">Online</button><button class="tab" data-f="exp">Expirados</button><button class="tab" data-f="bloq">Bloqueados</button>
    </div>
    <input id="busca" placeholder="Buscar nome ou código" style="min-width:240px" oninput="render()">
  </div>
  <div class="users" id="lista"></div>
  <div class="note" id="aviso"></div>
</div>
<div class="toast" id="toast"></div>

<script>
let K = sessionStorage.getItem('amdAdminK') || '', DADOS = {}, FILTRO = 'todos';
const ONLINE_MS = 3 * 60000;
async function api(p, m, b) {
  const r = await fetch(p, { method: m || 'GET', headers: { 'Content-Type': 'application/json', 'X-Admin': K }, body: b ? JSON.stringify(b) : undefined });
  if (r.status === 401) throw new Error('senha');
  return r.json();
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }
function toast(t) { const e = document.getElementById('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 1800); }
function copiar(t) { navigator.clipboard.writeText(t).then(() => toast('Copiado: ' + t)).catch(() => toast(t)); }
function dur(ms) {
  ms = Math.max(0, Number(ms) || 0);
  const d = Math.floor(ms / 86400000), h = Math.floor(ms % 86400000 / 3600000), m = Math.floor(ms % 3600000 / 60000);
  if (d) return d + 'd ' + h + 'h'; if (h) return h + 'h ' + m + 'min'; return m + 'min';
}
function quando(ts) {
  if (!ts) return 'nunca';
  const ms = Date.now() - ts;
  if (ms < ONLINE_MS) return 'agora';
  if (ms < 3600000) return 'há ' + Math.floor(ms / 60000) + ' min';
  if (ms < 86400000) return 'há ' + Math.floor(ms / 3600000) + 'h';
  return new Date(ts).toLocaleDateString('pt-BR') + ' ' + new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
function cor(nome) { let h = 0; for (const c of String(nome || '?')) h = (h * 31 + c.charCodeAt(0)) % 360; return 'hsl(' + h + ',55%,42%)'; }
function iniciais(nome) { const p = String(nome || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); }

async function entrar() {
  K = K || document.getElementById('k').value;
  if (!K) K = document.getElementById('k').value;
  try {
    await lista();
    sessionStorage.setItem('amdAdminK', K);
    document.getElementById('login').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    setInterval(lista, 30000);
  } catch (e) {
    K = ''; sessionStorage.removeItem('amdAdminK');
    document.getElementById('dica').textContent = 'Senha incorreta.';
  }
}
function sair() { sessionStorage.removeItem('amdAdminK'); location.reload(); }
async function lista() {
  const j = await api('/api/admin/codigos');
  DADOS = j.codigos || {};
  document.getElementById('aviso').textContent = j.autoassinado
    ? 'Códigos autoassinados e salvos na memória do servidor: continuam valendo após reinício e deploy. "Tempo de uso" conta o período com o site aberto.'
    : 'Atenção: sem persistência configurada.';
  document.getElementById('atual').textContent = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR');
  render();
}
function render() {
  const agora = Date.now(), q = document.getElementById('busca').value.trim().toLowerCase();
  const itens = Object.entries(DADOS).map(([c, d]) => ({ c, ...d, bloq: !!d.bloqueado, ativo: !d.bloqueado && agora < d.expira, online: !d.bloqueado && agora < d.expira && d.ultimoUso && agora - d.ultimoUso < ONLINE_MS }));
  document.getElementById('sAtivos').textContent = itens.filter(i => i.ativo).length;
  document.getElementById('sOnline').textContent = itens.filter(i => i.online).length;
  document.getElementById('sExp').textContent = itens.filter(i => !i.ativo && !i.bloq).length;
  document.getElementById('sUso').textContent = dur(itens.reduce((s, i) => s + (i.tempoUso || 0), 0));
  let ver = itens.filter(i => FILTRO === 'todos' || (FILTRO === 'ativos' && i.ativo) || (FILTRO === 'online' && i.online) || (FILTRO === 'exp' && !i.ativo && !i.bloq) || (FILTRO === 'bloq' && i.bloq));
  if (q) ver = ver.filter(i => (i.nome || '').toLowerCase().includes(q) || i.c.toLowerCase().includes(q));
  ver.sort((a, b) => (b.online - a.online) || (b.ativo - a.ativo) || ((b.ultimoUso || b.criado || 0) - (a.ultimoUso || a.criado || 0)));
  const el = document.getElementById('lista');
  if (!ver.length) { el.innerHTML = '<div class="card vazio">Nenhum acesso encontrado.</div>'; return; }
  el.innerHTML = ver.map(i => {
    const resta = i.expira - agora, total = i.criado ? (i.expira - i.criado) : 0;
    const pct = total > 0 ? Math.max(0, Math.min(100, resta / total * 100)) : (i.ativo ? 100 : 0);
    const pill = i.bloq ? '<span class="pill bad">Bloqueado</span>' : !i.ativo ? '<span class="pill bad">Expirado</span>' : resta < 86400000 ? '<span class="pill warn">Vence em breve</span>' : '<span class="pill ok">Ativo</span>';
    const barCor = i.bloq ? '#556273' : !i.ativo ? 'var(--bad)' : resta < 86400000 ? 'var(--warn)' : 'var(--ok)';
    const nome = i.nome || 'Sem nome';
    return '<div class="u">' +
      '<div class="av" style="background:' + cor(nome) + '">' + esc(iniciais(nome)) + '<span class="dot' + (i.online ? ' on' : '') + '"></span></div>' +
      '<div><div class="nm">' + esc(nome) + ' ' + pill + '</div><div class="cd" title="Copiar" onclick="copiar(\'' + esc(i.c) + '\')">' + esc(i.c) + '</div></div>' +
      '<div><div class="lbl">Restante</div><div class="val">' + (i.ativo ? dur(resta) : '—') + '</div><div class="bar"><i style="width:' + pct + '%;background:' + barCor + '"></i></div><div class="lbl" style="margin-top:4px;text-transform:none">até ' + new Date(i.expira).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + '</div></div>' +
      '<div class="hide-m"><div class="lbl">Tempo de uso</div><div class="val">' + dur(i.tempoUso) + '</div><div class="lbl" style="text-transform:none">' + (i.usos || 0) + ' entradas</div></div>' +
      '<div class="hide-m"><div class="lbl">Último acesso</div><div class="val" style="color:' + (i.online ? 'var(--ok)' : 'inherit') + '">' + quando(i.ultimoUso) + '</div><div class="lbl" style="text-transform:none">criado ' + (i.criado ? new Date(i.criado).toLocaleDateString('pt-BR') : '—') + '</div></div>' +
      '<div class="acts">' + (i.bloq
        ? '<button class="btn sm" onclick="bloquear(\'' + esc(i.c) + '\',false)">Desbloquear</button>'
        : '<button class="btn sm" onclick="bloquear(\'' + esc(i.c) + '\',true)">Bloquear</button>') +
        '<button class="btn sm danger" onclick="excluir(\'' + esc(i.c) + '\')">Excluir</button></div>' +
      '</div>';
  }).join('');
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === b));
  FILTRO = b.dataset.f; render();
});
async function consultar() {
  const c = document.getElementById('cons').value.trim();
  if (!c) return;
  const j = await api('/api/admin/consultar', 'POST', { codigo: c });
  const el = document.getElementById('consRes');
  if (!j.expira) { el.style.color = 'var(--bad)'; el.textContent = 'Código desconhecido ou inválido.'; return; }
  el.style.color = j.valido ? 'var(--ok)' : 'var(--bad)';
  el.textContent = (j.valido ? 'Ativo' : (j.revogado ? 'Revogado' : 'Expirado')) + (j.nome ? ' · ' + j.nome : '') +
    ' · restante ' + (j.valido ? dur(j.expira - Date.now()) : '0') + (j.tempoUso ? ' · uso ' + dur(j.tempoUso) : '');
}
async function criar() {
  const nome = document.getElementById('nome').value.trim();
  if (!nome) { toast('Coloque o nome do cliente'); document.getElementById('nome').focus(); return; }
  const j = await api('/api/admin/criar', 'POST', { nome, dias: document.getElementById('dias').value });
  document.getElementById('novoCod').textContent = j.codigo;
  document.getElementById('novo').style.display = 'flex';
  document.getElementById('nome').value = '';
  copiar(j.codigo);
  await lista();
}
async function teste() { await api('/api/admin/testar-alerta', 'POST', {}); toast('Alerta de teste enviado'); }
function nomeDe(c) { return (DADOS[c] && DADOS[c].nome) || c; }
async function bloquear(c, sim) {
  if (sim && !confirm('Bloquear o acesso de ' + nomeDe(c) + '?\nEle sai do site na hora. Você pode desbloquear depois.')) return;
  await api('/api/admin/bloquear', 'POST', { codigo: c, bloquear: sim });
  toast(sim ? 'Acesso bloqueado' : 'Acesso liberado'); await lista();
}
async function excluir(c) {
  if (!confirm('Excluir ' + nomeDe(c) + ' de vez?\nO código para de funcionar e some da lista.')) return;
  await api('/api/admin/revogar', 'POST', { codigo: c });
  toast('Acesso excluído'); await lista();
}
if (K) entrar();
</script></body></html>
